name: gisila_doc
description: >-
  Generate OpenAPI 3.1 specs and shelf_router wiring from annotated Dart
  controllers. Minimal boilerplate, maximum type inference, bundled Swagger UI.
version: 0.1.1
environment:
  sdk: ^3.3.0
repository: https://github.com/gumisofts/gisila_doc

dependencies:
  meta: ^1.11.0
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  collection: ^1.18.0
  gisila: ^0.1.1

  # Build-time dependencies are declared here (not dev_dependencies) because
  # the builder library is exported from this package and consumers run it
  # through their own build_runner. Keeping them in the main deps avoids
  # surprising "missing transitive dep" errors for the generator.
  # Pinned to a window that retains the legacy element API
  # (ClassElement / ParameterElement / `parameters` etc.) while still
  # supporting modern Dart SDKs. analyzer 8+ removes ParameterElement.
  analyzer: ">=7.4.0 <8.0.0"
  build: ">=2.4.1 <3.0.0"
  source_gen: ">=2.0.0 <3.0.0"
  dart_style: ">=3.0.0 <4.0.0"

dev_dependencies:
  lints: ">=3.0.0 <7.0.0"
  test: ^1.24.0
  build_runner: ">=2.5.0 <3.0.0"
  build_test: ">=2.2.0 <4.0.0"
